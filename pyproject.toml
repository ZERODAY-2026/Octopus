[project]
name = "contracter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.20",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests",
    "ollama: requires a reachable local Ollama server",
    "embedding: requires the sentence-transformers model to be cached locally",
    "privacy: validates the zero-network guarantee",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/evaluation/__init__.py"]
